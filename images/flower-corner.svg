<!--
  Sulur / lotus floral corner ornament for the wedding cover.
  Hand-drawn, curling vine + lotus blossom + buds + leaves.
  Designed for top-left corner; mirror via CSS transform for other corners.
  Custom artwork — no license restriction.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" width="360" height="360" fill="none">
  <defs>
    <radialGradient id="petalGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f4d27a" stop-opacity="1"/>
      <stop offset="60%" stop-color="#d4a64a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#8a4a1e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leafGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4a2a14"/>
      <stop offset="100%" stop-color="#8a4a1e"/>
    </linearGradient>
    <radialGradient id="haloFlower" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f1c87a" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#f1c87a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Glow halo -->
  <circle cx="180" cy="180" r="160" fill="url(#haloFlower)"/>

  <!-- ===== MAIN VINE (sulur) — curls from corner to flower ===== -->
  <g fill="none" stroke="#d4a64a" stroke-width="2" stroke-linecap="round">
    <path d="M 20 320  C 60 280 80 240 110 200  C 140 160 170 140 200 110"/>
    <path d="M 40 340  C 70 310 90 280 110 250" opacity="0.7"/>
    <path d="M 10 280  C 50 250 80 220 110 180" opacity="0.55"/>
  </g>

  <!-- Tendrils (small curls) -->
  <g fill="none" stroke="#d4a64a" stroke-width="1.6" stroke-linecap="round">
    <path d="M 80 250 q -8 12 -2 22 q 8 6 12 -4" opacity="0.85"/>
    <path d="M 130 190 q -6 12 0 22 q 10 4 12 -8" opacity="0.85"/>
    <path d="M 170 150 q -4 14 4 22 q 12 2 12 -10" opacity="0.85"/>
  </g>

  <!-- ===== LEAVES along the vine ===== -->
  <g fill="url(#leafGrad)" stroke="#d4a64a" stroke-width="1">
    <path d="M 60 290 q 24 -22 44 -10 q -14 28 -44 10 Z"/>
    <path d="M 90 240 q 22 -20 40 -10 q -12 26 -40 10 Z"/>
    <path d="M 130 200 q 24 -22 44 -10 q -14 28 -44 10 Z"/>
    <path d="M 50 310 q 20 -16 34 -8 q -10 22 -34 8 Z" opacity="0.7"/>
  </g>
  <!-- Leaf midrib lines -->
  <g stroke="#f1c87a" stroke-width="0.8" fill="none">
    <path d="M 60 290 q 18 -6 38 0"/>
    <path d="M 90 240 q 18 -6 36 0"/>
    <path d="M 130 200 q 20 -6 40 0"/>
  </g>

  <!-- ===== SMALL BUDS along the stem ===== -->
  <g fill="#d4a64a" stroke="#f1c87a" stroke-width="0.8">
    <circle cx="100" cy="265" r="5"/>
    <circle cx="148" cy="215" r="4"/>
    <circle cx="40" cy="320" r="4" opacity="0.8"/>
    <circle cx="190" cy="135" r="6"/>
  </g>

  <!-- ===== MAIN LOTUS BLOSSOM (top-right of vine) ===== -->
  <g transform="translate(220 105)">
    <!-- Back petals -->
    <g fill="#6e1f1a" stroke="#d4a64a" stroke-width="1.2">
      <ellipse cx="0" cy="-40" rx="14" ry="32" transform="rotate(-40)"/>
      <ellipse cx="0" cy="-40" rx="14" ry="32"/>
      <ellipse cx="0" cy="-40" rx="14" ry="32" transform="rotate(40)"/>
    </g>
    <!-- Mid petals -->
    <g fill="url(#petalGlow)" stroke="#8a4a1e" stroke-width="1">
      <ellipse cx="0" cy="-30" rx="12" ry="26" transform="rotate(-65)"/>
      <ellipse cx="0" cy="-30" rx="12" ry="26" transform="rotate(-22)"/>
      <ellipse cx="0" cy="-30" rx="12" ry="26" transform="rotate(22)"/>
      <ellipse cx="0" cy="-30" rx="12" ry="26" transform="rotate(65)"/>
    </g>
    <!-- Front petals -->
    <g fill="#f1c87a" stroke="#8a4a1e" stroke-width="1">
      <ellipse cx="0" cy="-22" rx="10" ry="20" transform="rotate(-12)"/>
      <ellipse cx="0" cy="-22" rx="10" ry="20" transform="rotate(12)"/>
    </g>
    <!-- Center pistil -->
    <circle r="10" fill="#8a4a1e"/>
    <circle r="6" fill="#d4a64a"/>
    <circle r="2.5" fill="#f4d27a"/>
    <!-- Stamen dots -->
    <g fill="#3a1e08">
      <circle cx="-4" cy="-4" r="1"/>
      <circle cx="4" cy="-4" r="1"/>
      <circle cx="-4" cy="4" r="1"/>
      <circle cx="4" cy="4" r="1"/>
    </g>
  </g>

  <!-- ===== SECONDARY SMALL FLOWER ===== -->
  <g transform="translate(140 165)">
    <g fill="#d4a64a" stroke="#8a4a1e" stroke-width="0.8">
      <ellipse cx="0" cy="-12" rx="6" ry="12" transform="rotate(0)"/>
      <ellipse cx="0" cy="-12" rx="6" ry="12" transform="rotate(72)"/>
      <ellipse cx="0" cy="-12" rx="6" ry="12" transform="rotate(144)"/>
      <ellipse cx="0" cy="-12" rx="6" ry="12" transform="rotate(216)"/>
      <ellipse cx="0" cy="-12" rx="6" ry="12" transform="rotate(288)"/>
    </g>
    <circle r="5" fill="#6e1f1a" stroke="#f1c87a" stroke-width="0.8"/>
    <circle r="2" fill="#f4d27a"/>
  </g>

  <!-- Sparkles -->
  <g fill="#f4d27a">
    <circle cx="280" cy="60" r="1.5"/>
    <circle cx="60" cy="200" r="1.2"/>
    <circle cx="200" cy="40" r="1"/>
    <circle cx="120" cy="120" r="1"/>
  </g>
</svg>
