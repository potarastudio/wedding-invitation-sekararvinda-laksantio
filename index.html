<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/cover.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />

    <!-- Open Graph / WhatsApp / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://wedding-invitation-sekarvinda-laksa.vercel.app/" />
    <meta property="og:title" content="The Wedding of Sekarvinda &amp; Laksantio" />
    <meta property="og:description" content="Minggu, 21 Juni 2026 — Grha Sarina Vidi, Sleman. Mohon doa restu kehadirannya." />

    <meta property="og:image:secure_url" content="https://wedding-invitation-sekarvinda-laksa.vercel.app/cover/couple.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="852" />
    <meta property="og:image:height" content="1280" />
    <meta property="og:image:alt" content="Sekarvinda &amp; Laksantio" />
    <meta property="og:locale" content="id_ID" />
    <meta property="og:site_name" content="Undangan Pernikahan Sekarvinda &amp; Laksantio" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="The Wedding of Sekarvinda &amp; Laksantio" />
    <meta name="twitter:description" content="Minggu, 21 Juni 2026 — Grha Sarina Vidi, Sleman." />
    <meta name="twitter:image" content="https://wedding-invitation-sekarvinda-laksa.vercel.app/cover/couple.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- 1) Critical fonts used on the Cover (first paint): only the weights actually rendered -->
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Great+Vibes&family=Playfair+Display:wght@500;600&display=swap"
      rel="stylesheet"
    />

    <!-- 2) Non-critical fonts (Amiri only — used inside Pambuko after the cover opens).
         Loaded async so they don't block first paint. -->
    <link
      rel="preload" as="style"
      href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" />
    </noscript>

    <!-- Preload the largest Cover hero asset so it overlaps with the JS download -->
    <link rel="preload" as="image" href="/cover/scenery-bg.png" fetchpriority="high" />
    <link rel="preload" as="image" href="/cover/photo.jpg" fetchpriority="high" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
